<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Placement Portal</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <h2>🎓 Student Portal</h2>

        <div class="nav-links">
            <a href="#home">Home</a>
            <a href="#jobs">Jobs</a>
            <a href="#applications">Applications</a>
        </div>
    </nav>


    <!-- Hero Section -->
    <section id="home" class="hero">

        <h1>Find Your Dream Job 🚀</h1>

        <p>
            Search and apply for jobs based on your skills and location.
        </p>

        <div class="search-box">

            <input
                type="text"
                id="searchInput"
                placeholder="Search job title or location..."
            >

            <button id="searchButton">
                Search
            </button>

        </div>

    </section>


    <!-- Statistics -->
    <section class="stats">

        <div class="stat-card">
            <h2 id="studentCount">1250</h2>
            <p>Students</p>
        </div>

        <div class="stat-card">
            <h2>85</h2>
            <p>Companies</p>
        </div>

        <div class="stat-card">
            <h2 id="jobCount">0</h2>
            <p>Jobs</p>
        </div>

    </section>


    <!-- Jobs Section -->
    <section id="jobs" class="container">

        <h2>Available Jobs</h2>

        <div id="jobContainer" class="job-container">
            <!-- JavaScript will create jobs here -->
        </div>

    </section>


    <!-- Applications Section -->
    <section id="applications" class="container">

        <h2>My Applications</h2>

        <div id="applicationContainer">
            <!-- Applications will appear here -->
        </div>

    </section>


    <!-- Application Modal -->
    <div id="applicationModal" class="modal">

        <div class="modal-content">

            <span id="closeModal" class="close">&times;</span>

            <h2>Apply for Job</h2>

            <form id="applicationForm">

                <input
                    type="text"
                    id="studentName"
                    placeholder="Enter your name"
                    required
                >

                <input
                    type="email"
                    id="studentEmail"
                    placeholder="Enter your email"
                    required
                >

                <input
                    type="text"
                    id="studentSkill"
                    placeholder="Enter your skill"
                    required
                >

                <button type="submit">
                    Submit Application
                </button>

            </form>

        </div>

    </div>


    <script src="main.js"></script>

</body>
</html>
